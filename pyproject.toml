[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firetv-desktop"
version = "0.1.0"
description = "Controle de Fire TV Stick para desktop (Windows), via ADB pela rede local"
requires-python = ">=3.10"
dependencies = ["PySide6", "adb-shell"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller"]

[project.scripts]
firetv = "firetv.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
