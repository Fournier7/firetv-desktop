name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: FireTVDesktop
          path: |
            dist/FireTVDesktop.exe
            dist/FireTVDesktopSetup.exe
